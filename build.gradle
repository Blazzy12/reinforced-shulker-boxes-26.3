plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "com.diffplug.spotless" version "8.2.1" apply false
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

allprojects {
	repositories {
		// Add repositories to retrieve artifacts from in here.
		// You should only use this when depending on other mods because
		// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
		// See https://docs.gradle.org/current/userguide/declaring_repositories.html
		// for more information about repositories.

		// ModMenu (Reinforced Core deps)
		maven {
			url = "https://maven.terraformersmc.com/releases/"
		}

		// Cloth Config (Reinforced Core deps)
		maven {
			url = "https://maven.shedaniel.me/"
		}

		// Shulker Box Tooltip
		maven {
			url = "https://maven.misterpemodder.com/libs-release"
		}

		// // Quick Shulker
		// maven {
		// 	url = "https://maven.kyrptonaught.dev"
		// }
	}
}

evaluationDependsOn(":reinforced-core")

loom {
	splitEnvironmentSourceSets()

	mods {
		"reinfshulker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}

		// Reinforced Core is built from the bundled subproject
		"reinfcore" {
			sourceSet("main", ":reinforced-core")
			sourceSet("client", ":reinforced-core")
		}
	}

	runs {
		serverTest {
			server()
			ideConfigGenerated true
			name "Minecraft Server Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			vmArg "-Datonkish.reinfshulker.gametest"
			runDir "build/gametest"
		}

		clientTest {
			client()
			ideConfigGenerated true
			name "Minecraft Client Test"
			vmArg "-Datonkish.reinfshulker.gametest"
			runDir "build/gametest"
		}
	}

	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

// Client game tests (real client, screenshots); kept out of the shipped jar: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "reinfshulker-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Reinforced Core (bundled subproject)
	implementation project(":reinforced-core")
	clientImplementation rootProject.project(":reinforced-core").sourceSets.client.output
	include project(":reinforced-core")

	// Mod Menu / Cloth Config (Reinforced Core deps, available in dev runtime)
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Shulker Box Tooltip
	implementation "com.misterpemodder:shulkerboxtooltip-fabric:${project.shulker_box_tooltip_version}"

	// // Quick Shulker
	// implementation "net.kyrptonaught:quickshulker:${project.quick_shulker_version}"
	// // Quick Shulker deps
	// implementation "net.kyrptonaught:shulkerutils:${project.shulkerutils_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.1 upwards uses Java 25.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def archivesName = base.archivesName.get()
	inputs.property "archivesName", archivesName

	from("LICENSE") {
		rename { "${it}_${archivesName}"}
	}
}

apply from: "${rootProject.projectDir}/gradle/style.gradle"
