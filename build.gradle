plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
	id "maven-publish"
	id "com.modrinth.minotaur" version "2.+"
	id "com.diffplug.spotless" version "8.2.1" apply false
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

allprojects {
	repositories {
		// Add repositories to retrieve artifacts from in here.
		// You should only use this when depending on other mods because
		// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
		// See https://docs.gradle.org/current/userguide/declaring_repositories.html
		// for more information about repositories.

		// ModMenu (Reinforced Core deps)
		maven {
			url = "https://maven.terraformersmc.com/releases/"
		}

		// Cloth Config (Reinforced Core deps)
		maven {
			url = "https://maven.shedaniel.me/"
		}

		// Shulker Box Tooltip
		maven {
			url = "https://maven.misterpemodder.com/libs-release"
		}

		// // Quick Shulker
		// maven {
		// 	url = "https://maven.kyrptonaught.dev"
		// }
	}
}

evaluationDependsOn(":reinforced-core")

loom {
	splitEnvironmentSourceSets()

	mods {
		"reinfshulker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}

		// Reinforced Core is built from the bundled subproject
		"reinfcore" {
			sourceSet("main", ":reinforced-core")
			sourceSet("client", ":reinforced-core")
		}
	}

	runs {
		serverTest {
			server()
			ideConfigGenerated true
			name "Minecraft Server Test"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest/junit.xml"
			vmArg "-Datonkish.reinfshulker.gametest"
			runDir "build/gametest"
		}

		clientTest {
			client()
			ideConfigGenerated true
			name "Minecraft Client Test"
			vmArg "-Datonkish.reinfshulker.gametest"
			runDir "build/gametest"
		}
	}

	accessWidenerPath = file("src/main/resources/${project.mod_id}.accesswidener")
}

// Client game tests (real client, screenshots); kept out of the shipped jar: ./gradlew runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "reinfshulker-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Reinforced Core (bundled subproject)
	implementation project(":reinforced-core")
	clientImplementation rootProject.project(":reinforced-core").sourceSets.client.output
	include project(":reinforced-core")

	// Mod Menu / Cloth Config (Reinforced Core deps, available in dev runtime)
	implementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
	implementation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// Shulker Box Tooltip
	implementation "com.misterpemodder:shulkerboxtooltip-fabric:${project.shulker_box_tooltip_version}"

	// // Quick Shulker
	// implementation "net.kyrptonaught:quickshulker:${project.quick_shulker_version}"
	// // Quick Shulker deps
	// implementation "net.kyrptonaught:shulkerutils:${project.shulkerutils_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	// Minecraft 26.1 upwards uses Java 25.
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def archivesName = base.archivesName.get()
	inputs.property "archivesName", archivesName

	from("LICENSE") {
		rename { "${it}_${archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
		maven {
			url = "file://${project.layout.buildDirectory.get()}/maven"
		}
	}
}

apply from: "${rootProject.projectDir}/gradle/style.gradle"

task curseforge(type: Exec) {
	environment "CURSEFORGE_API_TOKEN", project.findProperty("curseforge_token") ?: "Missing token"
	commandLine "sh", "-c", """
		set -eux

		# install
		MCMOD_RELEASER_VERSION="0.1.1"
		curl -sL https://github.com/Aton-Kish/mcmod-releaser/releases/download/v\${MCMOD_RELEASER_VERSION}/mcmod-releaser_\${MCMOD_RELEASER_VERSION}_linux_amd64.tar.gz | tar xzf - mcmod-releaser
		./mcmod-releaser --version

		# release
		./mcmod-releaser curseforge \
			--file "build/libs/${project.archives_base_name}-${project.version}.jar" \
			--project-id "${project.curseforge_id}" \
			--release-type "beta" \
			--version "${project.version}" \
			--name "Reinforced Shulker Boxes v${project.version}" \
			--changelog "[v${project.version}](https://github.com/Blazzy12/reinforced-shulker-boxes-26.3/releases/tag/v${java.net.URLEncoder.encode(project.version, "UTF-8")})" \
			--environments "Client,Server" \
			--loaders "Fabric" \
			--java-versions "Java 25" \
			--game-versions "26.3" \
			--dependencies "fabric-api=required,cloth-config=embedded,modmenu=optional,shulkerboxtooltip=optional,reinforced-chests=optional"
	"""
}

modrinth {
	token = project.findProperty("modrinth_token") ?: "Missing token"

	projectId = project.modrinth_id

	uploadFile = jar
	versionNumber = project.version
	versionName = "Reinforced Shulker Boxes v${project.version}"
	versionType = "beta"
	changelog = "[v${project.version}](https://github.com/Blazzy12/reinforced-shulker-boxes-26.3/releases/tag/v" + java.net.URLEncoder.encode(project.version, "UTF-8") + ")"

	gameVersions = ["26.3"]
	loaders = ["fabric"]

	dependencies {
		required.project "fabric-api"
		embedded.project "cloth-config"
		optional.project "modmenu"
		optional.project "shulkerboxtooltip"
		// optional.project "quickshulker"
		optional.project "reinforced-chests"
	}
}
